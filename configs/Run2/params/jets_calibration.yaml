# Jet calibration overrides. Everything else (correctionlib JEC/JER tags on cvmfs, calibrated
# collections incl. CorrT1METJet for the type-1 MET) comes from pocket-coffea's defaults:
# pocket_coffea/parameters/jets_calibration.yaml.
#
# JME: undo the JECs stored in NanoAOD and reapply the recommended ones, in data AND MC; the
# type-1 MET is then recomputed from the same corrected AK4 jets (configs/common/met_calibration.py).
#
# The variations actually run are chosen per job with PC_JEC_VARIATION (inference_common.py),
# from either list:
#   default_jets_calibration.variations.total_variation  -> JES_Total, JER
#   default_jets_calibration.variations.full_variations  -> JES_Regrouped_<source>[_<year>], JER

default_jets_calibration:
  factory_config_clib:
    AK4PFchs:
      2016_PreVFP:
        jec_data:
          # the 2016 PreVFP run B datasets are labelled B_ver1 / B_ver2 (AK8 uses the same table)
          B_ver1: "${default_jets_calibration.factory_config_clib.AK4PFchs.2016_PreVFP.jec_data.B}"
          B_ver2: "${default_jets_calibration.factory_config_clib.AK4PFchs.2016_PreVFP.jec_data.B}"

jets_calibration:
  variations: "${default_jets_calibration.variations.total_variation}"

  # Reapply the recommended JECs to data too (pocket-coffea's Run 2 default keeps NanoAOD's)
  apply_jec_Data:
    2016_PreVFP:
      AK4PFchs: True
      AK8PFPuppi: True
    2016_PostVFP:
      AK4PFchs: True
      AK8PFPuppi: True
    "2017":
      AK4PFchs: True
      AK8PFPuppi: True
    "2018":
      AK4PFchs: True
      AK8PFPuppi: True
