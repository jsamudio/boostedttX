# MET phi (XY) correction of the type-1 PF MET (JME, Run 2 UL), applied by
# configs/common/met_calibration.METType1Calibrator after the type-1 recomputation, data and MC,
# nominal and every variation. Corrections {pt,phi}_metphicorr_pfmet_{data,mc}(met_pt, met_phi, npvs, run).
# Pinned to the jsonpog version of 2026-11-11 (the one you checked for 2018).
met_xy_correction:
  apply: true
  files:
    '2016_PreVFP':  /cvmfs/cms-griddata.cern.ch/cat/metadata/JME/Run2-2016preVFP-UL-NanoAODv9/2026-11-11/met.json.gz
    '2016_PostVFP': /cvmfs/cms-griddata.cern.ch/cat/metadata/JME/Run2-2016postVFP-UL-NanoAODv9/2026-11-11/met.json.gz
    '2017':         /cvmfs/cms-griddata.cern.ch/cat/metadata/JME/Run2-2017-UL-NanoAODv9/2026-11-11/met.json.gz
    '2018':         /cvmfs/cms-griddata.cern.ch/cat/metadata/JME/Run2-2018-UL-NanoAODv9/2026-11-11/met.json.gz
