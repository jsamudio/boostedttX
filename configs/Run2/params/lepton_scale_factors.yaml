# Overrides of pocket-coffea's lepton_scale_factors defaults (correction files come from the defaults).
# Muon SFs for the MediumID + loose relative isolation selection (object_cleaning_functions.lep_sel).
lepton_scale_factors:
  muon_sf:
    collection: MuonGood
    sf_name:
      2016_PreVFP:
        id: NUM_MediumID_DEN_TrackerMuons
        iso: NUM_LooseRelIso_DEN_MediumID
        trigger: NUM_IsoMu24_or_IsoTkMu24_DEN_CutBasedIdTight_and_PFIsoTight
        reco: NUM_TrackerMuons_DEN_genTracks
      2016_PostVFP:
        id: NUM_MediumID_DEN_TrackerMuons
        iso: NUM_LooseRelIso_DEN_MediumID
        trigger: NUM_IsoMu24_or_IsoTkMu24_DEN_CutBasedIdTight_and_PFIsoTight
        reco: NUM_TrackerMuons_DEN_genTracks
      '2017':
        id: NUM_MediumID_DEN_TrackerMuons
        iso: NUM_LooseRelIso_DEN_MediumID
        trigger: NUM_IsoMu27_DEN_CutBasedIdTight_and_PFIsoTight
        reco: NUM_TrackerMuons_DEN_genTracks
      '2018':
        id: NUM_MediumID_DEN_TrackerMuons
        iso: NUM_LooseRelIso_DEN_MediumID
        trigger: NUM_IsoMu24_DEN_CutBasedIdTight_and_PFIsoTight
        reco: NUM_TrackerMuons_DEN_genTracks
