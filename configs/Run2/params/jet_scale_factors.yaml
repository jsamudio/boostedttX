# Overrides of pocket-coffea's jet_scale_factors defaults.
# The defaults only provide jet veto maps for the NanoAODv15 Run 2 eras; these are the v9 (UL) ones.
jet_scale_factors:
  vetomaps:
    '2016_PreVFP':
      file: ${cvmfs:Run2-2016preVFP-UL-NanoAODv9,JME,jetvetomaps.json.gz}
      name: "Summer19UL16_V1"
    '2016_PostVFP':
      file: ${cvmfs:Run2-2016postVFP-UL-NanoAODv9,JME,jetvetomaps.json.gz}
      name: "Summer19UL16_V1"
    '2017':
      file: ${cvmfs:Run2-2017-UL-NanoAODv9,JME,jetvetomaps.json.gz}
      name: "Summer19UL17_V1"
    '2018':
      file: ${cvmfs:Run2-2018-UL-NanoAODv9,JME,jetvetomaps.json.gz}
      name: "Summer19UL18_V1"
